# ─── quasarserver.teamzemo.tech — Backend API (Node.js) ──────────────────────
server {
    listen 80;
    server_name quasarserver.teamzemo.tech;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name quasarserver.teamzemo.tech;

    # ── TLS ──────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/quasarserver.teamzemo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quasarserver.teamzemo.tech/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────
    add_header X-Frame-Options       "DENY"    always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── REST + WebSocket proxy ────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        # WebSocket upgrade support
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Increase body size limit for file uploads
        client_max_body_size 20m;
    }
}
