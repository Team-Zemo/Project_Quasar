# ─── quasar.teamzemo.tech — Frontend (Vite static build) ─────────────────────
server {
    listen 80;
    server_name quasar.teamzemo.tech;

    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name quasar.teamzemo.tech;

    # ── TLS (fill in after certbot) ──────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/quasar.teamzemo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quasar.teamzemo.tech/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # ── Serve static Vite build ──────────────────────────────────────
    root  /var/www/quasar-frontend/dist;
    index index.html;

    # Cache hashed assets forever; the root index.html must never be cached
    location ~* \.(js|css|woff2?|ttf|svg|png|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other routes → SPA index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy /api/* and /auth/* to backend ───────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── WebSocket proxy (/ws/*) ───────────────────────────────────────
    location /ws/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
